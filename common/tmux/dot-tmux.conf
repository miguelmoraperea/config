if-shell "test $(uname) = 'Linux'" {
    set-option -g default-shell /usr/bin/fish

    set -g default-terminal "screen-256color"
    set-option -sa terminal-overrides ",xterm-256color*:Tc"

    # Copy to clipboard
    bind -T copy-mode-vi y send-keys -X copy-pipe-no-clear 'xclip -in -selection clipboard'
}

if-shell "test $(uname) = 'Darwin'" {
    set-option -g default-shell /bin/zsh

    set-option -g default-terminal "screen-256color"
    set-option -sa terminal-overrides ",xterm-256color*:Tc"

    # Enable clipboard integration
    set -g set-clipboard on

    # Copy to clipboard
    bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
    bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-no-clear \; run-shell 'tmux save-buffer - | pbcopy'
    bind-key -T copy-mode-vi 'Y' send-keys -X copy-line
    bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel \; run-shell 'tmux save-buffer - | pbcopy'
}

set -g focus-events on

set -g base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g automatic-rename-format '#{?#{==:#{pane_current_command},.claude-wrapped},claude,#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}}'
set-option -g set-titles on

setw -g mode-keys vi
setw -g mouse on

# Mouse selection should not implicitly overwrite the clipboard/buffer.
# Drag/double/triple click only selects; press y/Enter to copy explicitly.
bind -T copy-mode-vi MouseDown1Pane send -X clear-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection
bind -T copy-mode MouseDragEnd1Pane send -X stop-selection
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X stop-selection
bind -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X stop-selection
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X stop-selection
bind -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X stop-selection
bind -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H; send-keys -X select-word; send-keys -X stop-selection"
bind -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H; send-keys -X select-line; send-keys -X stop-selection"

setw -g monitor-activity on

# Let apps like Pi request modified-key reporting for Shift+Enter.
set -g xterm-keys on
set -g extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'ghostty*:extkeys'
set -as terminal-features 'wezterm*:extkeys'

# Hyperlinks
set -as terminal-features ",*:hyperlinks"

# No delay for escape key press
set -sg escape-time 0

# Remap prefix from 'Ctrl-b' to 'Ctrl-t'
unbind C-b
set-option -g prefix C-t
bind-key C-x send-prefix

# Set history limit
set -g history-limit 8192

# Status bar colours
set -g status-bg "#192330"
set -g status-fg "#aeafb0"
set -g window-status-activity-style "bg=#192330, fg=#dbc074"
set -g window-status-separator "  "
set -g window-status-format "#[fg=#71839b]#{?#{@agent},#{@agent} ,}#I #W#[default]"
set -g window-status-current-format "#[fg=#63cdcf,bg=#192330]#[fg=#192330,bg=#63cdcf,bold] #{?#{@agent},#{@agent} ,}#I #W #[fg=#63cdcf,bg=#192330]#[default]"

# choose-tree draws the session name / window index itself (leftmost), then our
# -F text. So we only supply what follows: window rows get the @agent glyph +
# name; session rows get the @agent_rollup tally. Don't repeat session_name /
# window_index in -F or they render twice.
# Recompute @agent_rollup synchronously right before opening, so the picker
# reflects live per-window @agent state (the cached option can go stale if a
# Pi pane runs an older extension build that doesn't refresh it on transition).
bind-key s run-shell "~/.pi/agent/extensions/agent-state/tmux-state.sh rollup" \; choose-tree -Zs -F "#{?pane_format,#{pane_current_command}  #{pane_title},#{?window_format,#{?#{@agent},#{@agent} ,}#{window_name}#{window_flags},#{?#{@agent_rollup},#{@agent_rollup} │ ,}#{session_windows} windows#{?session_attached, (attached),}}}"
bind-key w run-shell "~/.pi/agent/extensions/agent-state/tmux-state.sh rollup" \; choose-tree -Zw -F "#{?pane_format,#{pane_current_command}  #{pane_title},#{?window_format,#{?#{@agent},#{@agent} ,}#{window_name}#{window_flags},#{?#{@agent_rollup},#{@agent_rollup} │ ,}#{session_windows} windows#{?session_attached, (attached),}}}"

# Jump to the next blocked (🔴) agent window; the agent-state extension keeps
# @agent / @agent_rollup current, so the status bar just reads the global tally.
bind-key B run-shell "~/.pi/agent/extensions/agent-state/tmux-state.sh jump-blocked"

# Acknowledge / clear the current agent's red (idle-escalation or end-on-error):
# signals the pi process (SIGUSR2 via @agent_pid) so it resets its own state.
# A live prompt-red is left intact.
bind-key a run-shell "~/.pi/agent/extensions/agent-state/tmux-state.sh ack #{pane_id}"
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 60
set -g status-left "[#{session_name}] #[fg=colour244]│#[default] "
set -g status-right "#(~/.pi/agent/extensions/agent-state/tmux-state.sh global) #[fg=colour244]│#[default] %H:%M %d-%b-%y"

# Separator row between the panes and the status bar. status-format[0] is the
# TOP line (against the panes) = a thin dim rule; status-format[1] is the bottom
# line = tmux 3.5a default assembled content verbatim (preserves mouse click
# ranges). If tmux is upgraded and the bar looks wrong, regenerate [1] from
# `tmux show -gv status-format[0]` on a single-line status.
set -g status 2
set -g 'status-format[1]' "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set -g 'status-format[0]' "#[fg=colour244,bg=default]────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────"
set-window-option -g window-status-current-style "default"

set -g wrap-search off

# Harpoon
unbind n # Disable switch to the next window
unbind e
bind-key -r e run-shell "/Users/miguel/.local/share/nvim/lazy/harpoon/scripts/tmux/switch-back-to-nvim"

# Attempt to change to window or create a new one if it doesn't exist
bind-key 0 if-shell '/opt/homebrew/bin/tmux select-window -t :0' '' 'new-window -t :0'
bind-key 1 if-shell '/opt/homebrew/bin/tmux select-window -t :1' '' 'new-window -t :1'
bind-key 2 if-shell '/opt/homebrew/bin/tmux select-window -t :2' '' 'new-window -t :2'
bind-key 3 if-shell '/opt/homebrew/bin/tmux select-window -t :3' '' 'new-window -t :3'
bind-key 4 if-shell '/opt/homebrew/bin/tmux select-window -t :4' '' 'new-window -t :4'
bind-key 5 if-shell '/opt/homebrew/bin/tmux select-window -t :5' '' 'new-window -t :5'
bind-key 6 if-shell '/opt/homebrew/bin/tmux select-window -t :6' '' 'new-window -t :6'
bind-key 7 if-shell '/opt/homebrew/bin/tmux select-window -t :7' '' 'new-window -t :7'
bind-key 8 if-shell '/opt/homebrew/bin/tmux select-window -t :8' '' 'new-window -t :8'
bind-key 9 if-shell '/opt/homebrew/bin/tmux select-window -t :9' '' 'new-window -t :9'

# Move current window to specific position (prefix + m + number)
# Swaps windows and follows focus to new position
bind-key m switch-client -T move_window
bind-key -T move_window 0 { swap-window -t :0; select-window -t :0 }
bind-key -T move_window 1 { swap-window -t :1; select-window -t :1 }
bind-key -T move_window 2 { swap-window -t :2; select-window -t :2 }
bind-key -T move_window 3 { swap-window -t :3; select-window -t :3 }
bind-key -T move_window 4 { swap-window -t :4; select-window -t :4 }
bind-key -T move_window 5 { swap-window -t :5; select-window -t :5 }
bind-key -T move_window 6 { swap-window -t :6; select-window -t :6 }
bind-key -T move_window 7 { swap-window -t :7; select-window -t :7 }
bind-key -T move_window 8 { swap-window -t :8; select-window -t :8 }
bind-key -T move_window 9 { swap-window -t :9; select-window -t :9 }
